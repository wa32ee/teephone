<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Kai Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Grand+Hotel&display=swap" rel="stylesheet">
<style id="css">
:root{--blue:#0a84ff;--green:#30d158;--red:#ff453a;--sep:rgba(84,84,88,.6);--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);--bg2:#1c1c1e;--bg3:#2c2c2e;--glass:rgba(255,255,255,.16);--page:#0b0b10}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#d9d7e2}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","IBM Plex Sans Thai","Helvetica Neue",system-ui,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;container-type:size}
@media (min-width:600px){.phone{width:393px;height:min(852px,94vh);border-radius:55px;border:10px solid #1b1b1f;box-shadow:0 0 0 2px #3a3a40,0 30px 80px rgba(0,0,0,.5)}}
.layer{position:absolute;inset:0}
.wallbox{position:absolute;inset:0;overflow:hidden;background-size:cover;background-position:center}
.wallm{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- แถบสถานะ ---------- */
.status{position:absolute;top:0;left:0;right:0;z-index:96;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 17px) 30px 0 38px;font-weight:600;font-size:16px;pointer-events:none;letter-spacing:-.2px}
.status .sr{display:flex;align-items:center;gap:6px;font-size:14px}
.phone.light .status{color:#000}.phone.light .status svg{filter:invert(1)}
.phone.locked .status #stime{visibility:hidden}
.island{position:absolute;top:11px;left:50%;width:122px;height:35px;margin-left:-61px;background:#000;border-radius:20px;z-index:97}
@media (max-width:599px){.island{display:none}}
.homebar{position:absolute;bottom:0;left:0;right:0;height:26px;z-index:99;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;touch-action:none}
.homebar i{display:block;width:140px;height:5px;border-radius:3px;background:#fff;transition:transform .2s}
.homebar.drag i{transform:scaleX(1.12)}
.phone.light .homebar i{background:#000}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:rgba(40,40,44,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 18px;border-radius:22px;font-size:14px;z-index:120;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center;color:#fff}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- หน้าจอล็อก ---------- */
#lock{z-index:30;touch-action:none;transition:transform .45s cubic-bezier(.2,.85,.25,1)}
#lock.drag{transition:none}
.lshade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,0) 35%,rgba(0,0,0,.35))}
.lc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 66px) 14px 0}
.lock-ic{font-size:15px;opacity:.9;margin-bottom:6px}
.ldate{font-size:21px;font-weight:600;opacity:.92}
.lclock{font-size:104px;font-weight:700;line-height:1;letter-spacing:-2px;color:rgba(255,255,255,.93);text-shadow:0 2px 24px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.notifs{position:absolute;left:10px;right:10px;bottom:118px;display:flex;flex-direction:column;gap:8px}
.notif{display:flex;gap:11px;align-items:center;background:rgba(245,245,250,.2);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border-radius:24px;padding:12px 14px;font-size:15px;line-height:1.3;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25);animation:pop .55s both}
.notif .ico{width:38px;height:38px;border-radius:9px;flex:none}
.notif .nb{flex:1;min-width:0}.notif b{display:flex;justify-content:space-between;font-weight:600;font-size:15px}.notif b small{font-weight:400;opacity:.65;font-size:13px}
.lbtns{position:absolute;left:46px;right:46px;bottom:46px;display:flex;justify-content:space-between}
.lbtns button{width:50px;height:50px;border-radius:50%;background:rgba(40,40,45,.38);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.lbtns button.on{background:#fff;color:#000}
.lbtns svg{width:22px;height:22px}
.lhint{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:13px;opacity:.75}

/* ---------- รหัสผ่าน ---------- */
#pass{z-index:25;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 100px) 0 40px;opacity:0;pointer-events:none;transition:opacity .3s}
#pass.on{opacity:1;pointer-events:auto}
#pass .wallbox{filter:blur(40px) brightness(.62) saturate(1.3);transform:scale(1.2)}
#pass>*:not(.wallbox){position:relative}
#pass h2{margin:0 0 22px;font-size:20px;font-weight:500}
.dots{display:flex;gap:24px;height:14px;margin-bottom:56px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.3px solid #fff;transition:background .1s}.dots i.f{background:#fff}
.dots.shake{animation:shake .45s}
@keyframes shake{15%{transform:translateX(-16px)}35%{transform:translateX(14px)}55%{transform:translateX(-10px)}75%{transform:translateX(6px)}}
.keys{display:grid;grid-template-columns:repeat(3,80px);gap:16px 26px}
.keys button{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .15s}
.keys button b{font-size:37px;font-weight:400}.keys button small{font-size:10px;font-weight:700;letter-spacing:2.5px;margin-top:2px;height:11px}
.keys button:active{background:rgba(255,255,255,.55)}
.keys .z{grid-column:2}
.pbot{margin-top:auto;width:100%;display:flex;justify-content:space-between;padding:0 48px;font-size:17px}

/* ---------- หน้าโฮม ---------- */
#home{z-index:10;transition:transform .45s cubic-bezier(.2,.85,.25,1),opacity .35s}
#home.out{transform:scale(1.12);opacity:0}
.hscroll{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hpage{flex:0 0 100%;scroll-snap-align:start;padding:calc(env(safe-area-inset-top,0px) + 66px) 24px 0}
.grid{display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;row-gap:22px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;width:64px;white-space:nowrap;letter-spacing:-.1px}
.app>span{text-shadow:0 1px 3px rgba(0,0,0,.45);max-width:76px;overflow:hidden;text-overflow:ellipsis}
.ico{position:relative;width:64px;height:64px;border-radius:15px;overflow:hidden;flex:none;transition:transform .15s;background:#2c2c2e}
.ico svg,.ico img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.ico::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(0,0,0,.12);pointer-events:none}
.app:active .ico{transform:scale(.9)}
.bdg{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 6px;z-index:2}.bdg[hidden]{display:none}
.wg{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.wgbox{width:100%;border-radius:26px;background:rgba(120,110,105,.5);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.3)}
.mw{height:164px;display:flex;gap:16px;padding:16px;position:relative;text-align:left}
.mw .m-art{width:132px;height:132px;border-radius:12px;flex:none;overflow:hidden;background:linear-gradient(135deg,#8a7466,#4b3d35);display:grid;place-items:center;font-size:44px}
.mw .m-art img{width:100%;height:100%;object-fit:cover}
.mw .inf{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:6px}
.mw .np{font-size:12px;font-weight:600;letter-spacing:.5px;opacity:.85}
.mw .m-title{font-size:21px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw .m-artist{font-size:18px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw .m-btn{margin-top:12px;align-self:flex-start;background:rgba(255,255,255,.2);border-radius:20px;padding:8px 18px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.mw .note{position:absolute;top:14px;right:16px;font-size:22px}
.cdw{height:164px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.cdw small{font-size:12px;font-weight:600;color:#ff6961;letter-spacing:.3px}.cdw h3{margin:0;font-size:21px}.cdw p{margin:2px 0 0;opacity:.8;font-size:14px}.cdw .n{font-size:36px;font-weight:300}
.pages{position:absolute;left:0;right:0;bottom:122px;display:flex;justify-content:center;gap:8px;pointer-events:none}
.pages span{display:flex;gap:8px;background:rgba(0,0,0,.18);padding:6px 9px;border-radius:12px;backdrop-filter:blur(10px)}
.pages i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.4}.pages i.on{opacity:1}
.dock{position:absolute;left:12px;right:12px;bottom:18px;background:rgba(255,255,255,.2);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:38px;padding:16px 20px;display:flex;justify-content:space-between;box-shadow:inset 0 0 0 .6px rgba(255,255,255,.3)}

/* ---------- โครงแอป ---------- */
.appview{z-index:40;background:#000;opacity:0;pointer-events:none;transform:scale(.88);transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .25s;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 50px);overflow:hidden}
.appview.on{opacity:1;pointer-events:auto;transform:none}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;position:relative}
.nav .nb{color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px;white-space:nowrap}
.nav .nb b{font-size:28px;font-weight:300;line-height:.8;margin-top:-3px}
.nav .nt{position:absolute;left:90px;right:90px;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.nav .nr{margin-left:auto;display:flex;gap:16px;align-items:center;color:var(--blue);font-size:17px}
.nav .pav{width:32px;height:32px;font-size:14px}
.lt{margin:2px 0 8px;padding:0 16px;font-size:34px;font-weight:700;letter-spacing:.2px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:90px;-webkit-overflow-scrolling:touch}
.gh{padding:18px 32px 7px;font-size:13px;color:var(--sec);text-transform:uppercase}
.grp{margin:0 16px 8px;background:var(--bg2);border-radius:14px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 16px;min-height:46px;position:relative;font-size:17px}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.cell .ico{width:30px;height:30px;border-radius:7px}
.cell .fl{flex:1;min-width:0}.fl b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fl span{display:block;font-size:14px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ter);font-size:20px;margin-left:auto;flex:none}
.rt{margin-left:auto;font-size:15px;color:var(--sec);flex:none}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;overflow:hidden;background:var(--bg3)}
.av img,.av video{width:100%;height:100%;object-fit:cover;display:block}
.av.ini{background:linear-gradient(#a5a5ab,#858589);color:#fff;font-weight:600}
.tabbar{position:absolute;left:14px;right:14px;bottom:22px;height:62px;display:flex;justify-content:space-around;align-items:center;background:rgba(30,30,32,.72);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-radius:32px;z-index:5;box-shadow:inset 0 0 0 .6px rgba(255,255,255,.15)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:500;color:rgba(255,255,255,.75);padding:6px 10px;border-radius:24px}
.tabbar button.on{color:var(--blue);background:rgba(255,255,255,.1)}
.tabbar b{font-size:21px;font-weight:400;line-height:1.1}
.seg{display:flex;margin:6px auto 12px;background:rgba(118,118,128,.24);border-radius:9px;padding:2px;width:max-content}
.seg button{padding:6px 22px;border-radius:7px;font-size:13px;font-weight:500}.seg button.on{background:#636366}
.empty{padding:40px 30px;text-align:center;color:var(--sec);font-size:15px;line-height:1.5}
.btnp{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;border-radius:22px;padding:10px 20px;font-weight:600;font-size:15px}
.sheet{position:absolute;inset:0;z-index:88;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;animation:fade .2s}
.sheet .sc{width:100%;max-height:88%;overflow-y:auto;background:#1c1c1e;border-radius:28px 28px 0 0;padding:10px 0 40px;animation:pop .3s}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#5a5a5e;margin:0 auto 12px}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 24px 16px}
.pf .cover{width:calc(100% + 48px);height:120px;margin:-22px -24px 0;background:linear-gradient(135deg,#3a3a5a,#7a4b78) center/cover}
.pf .av{width:96px;height:96px;font-size:38px;margin-top:-48px;border:3px solid #1c1c1e}
.pf h3{margin:0;font-size:22px}.pf p{margin:0;color:var(--sec);white-space:pre-line}
.inp{width:100%;background:var(--bg3);border:0;border-radius:10px;padding:11px 13px;color:#fff;font-size:16px;-webkit-user-select:text;user-select:text}

/* ---------- หน้าจอโทร ---------- */
.callv{position:absolute;inset:0;z-index:94;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 80px) 26px 50px;text-align:center;overflow:hidden;animation:fade .25s;isolation:isolate;background:#16171d}
.callv .cbg{position:absolute;inset:-40px;background:linear-gradient(180deg,#3d3f52,#16171d) center/cover;filter:blur(40px) brightness(.55);z-index:-1}
.callv .via{font-size:14px;opacity:.7}
.callv .cn{font-size:36px;font-weight:500;margin-top:4px}
.callv .cs{font-size:17px;opacity:.7;margin-top:4px}.callv .cs.bad{color:var(--red);opacity:1}
.callv .av{width:110px;height:110px;font-size:44px;margin-top:22px}
.callv.ringing .av{animation:ringp 1.4s infinite}
@keyframes ringp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 28px rgba(255,255,255,0)}}
.subs{flex:1;width:100%;overflow-y:auto;margin:18px 0 10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.sub{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border-radius:18px;padding:8px 13px;font-size:16px;line-height:1.4;max-width:86%;align-self:flex-start;animation:pop .3s both}
.sub.me{align-self:flex-end;background:rgba(48,209,88,.42)}
.sub small{display:block;font-size:11px;opacity:.7}
.cgrid{display:grid;grid-template-columns:repeat(3,76px);gap:18px 28px;margin-bottom:28px}
.cgrid div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.cgrid button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);font-size:26px}
.cgrid button.on{background:#fff;color:#000}
.cend{display:flex;justify-content:space-around;width:100%}
.cend div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
.cend button{width:76px;height:76px;border-radius:50%;display:grid;place-items:center}
.cend .rj{background:#ff3b30}.cend .ac{background:#34c759}
.cend svg{width:34px;height:34px}

/* ---------- LINE ---------- */
.lnview{background:#111214}
.lnview .nav .nb{color:#fff}
.lnhead{display:flex;align-items:center;gap:10px;padding:2px 16px 10px}
.lnhead h1{margin:0;font-size:22px;flex:1}
.lnhead button{font-size:22px}
.lns{margin:0 16px 8px;background:#25272b;border-radius:10px;padding:9px 12px;font-size:15px;color:#8a8d91}
.lnl{flex:1;overflow-y:auto;padding-bottom:100px}
.lnr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 16px}
.lnr .av{width:52px;height:52px}
.lnr .tx{flex:1;min-width:0}.lnr .tx b{display:block;font-weight:500;font-size:16px}.lnr .tx span{display:block;font-size:13px;color:#8a8d91;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnr .r{font-size:12px;color:#8a8d91;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-height:36px}
.lnu{background:#06c755;color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:12px;font-weight:600}
.lnview .tabbar{background:rgba(20,21,23,.85)}.lnview .tabbar button.on{color:#06c755}
.lnme{position:relative;margin-bottom:8px}
.lnme .cv{height:150px;background:linear-gradient(135deg,#1f6f4a,#06c755) center/cover}
.lnme .row{display:flex;align-items:flex-end;gap:14px;padding:0 16px;margin-top:-36px}
.lnme .av{width:84px;height:84px;font-size:32px;border:3px solid #111214}
.lnme b{font-size:21px;display:block}.lnme span{color:#8a8d91;font-size:14px}
.lnbtn{display:inline-block;margin:12px 16px 4px;background:#25272b;border-radius:16px;padding:7px 14px;font-size:14px}
.lgh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;font-size:14px;color:#8a8d91}
.lgh button{color:#06c755;font-weight:600}
.lnchat{background:#8aa4c8}
.lnchat .nav{background:#1c2733;padding-bottom:6px}
.lnmsgs{flex:1;overflow-y:auto;background:#8ca8cd;padding:12px 10px 14px;display:flex;flex-direction:column;gap:4px;color:#000}
.lsep{align-self:center;background:rgba(0,0,0,.18);color:#fff;border-radius:12px;padding:3px 12px;font-size:12px;margin:8px 0}
.lr{display:flex;gap:8px;align-items:flex-start}.lr .av{width:36px;height:36px;font-size:14px}.lr .gap{width:36px;flex:none}
.lnm{font-size:12px;color:#20304a;margin:0 0 3px 2px}
.lbw{display:flex;align-items:flex-end;gap:5px}
.lb{background:#fff;border-radius:18px;padding:8px 13px;font-size:15px;line-height:1.4;max-width:235px;overflow-wrap:anywhere;white-space:pre-line;animation:pop .25s both}
.lr.me{justify-content:flex-end}.lr.me .lb{background:#86e36b}
.lbw small{font-size:10px;color:#22324a;text-align:right;line-height:1.25;flex:none}
.lnin{display:flex;gap:8px;align-items:center;padding:8px 12px 34px;background:#1c1c1e}
.lnin input{flex:1;background:#2c2c2e;border:0;border-radius:20px;padding:9px 14px;color:#fff;font-size:16px;user-select:text;-webkit-user-select:text}
.lnin button{width:36px;height:36px;border-radius:50%;color:#06c755;font-size:22px}
.typ{display:flex;gap:4px;padding:13px 14px}.typ i{width:7px;height:7px;border-radius:50%;background:#9aa3b0;animation:blink 1s infinite}
.typ i:nth-child(2){animation-delay:.2s}.typ i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

let AC, toneT;
function tone(kind) {
  stopTone(); try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) { return; }
  const beep = (f, len) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; g.gain.value = .06; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + len); };
  const cyc = kind === "ring" ? () => { beep(880, .25); setTimeout(() => beep(660, .25), 300); setTimeout(() => beep(880, .25), 600); } : () => beep(425, 1);
  cyc(); toneT = setInterval(cyc, kind === "ring" ? 2200 : 4000);
}
function stopTone() { clearInterval(toneT); }

/* ---------- เลือกไฟล์รูป/วิดีโอ/เสียง ---------- */
function pickFile(accept, opt = {}) {

    const f = el("input"); f.type = "file"; f.accept = accept; if (opt.multiple) f.multiple = true; if (opt.capture) f.setAttribute("capture", opt.capture);
    f.style.display = "none"; document.body.appendChild(f);
    f.onchange = async () => { const out = []; for (const file of f.files) out.push(await readFile(file, opt.max)); f.remove(); res(opt.multiple ? out : out[0] || null); };
    f.click();
  });
}
function readFile(file, max = 1280) {
  return new Promise(res => {
    const done = url => res({url, file, date: new Date(file.lastModified || Date.now())});
    if (/^image\//.test(file.type) && !/gif|svg/.test(file.type)) {
      const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas"); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); done(cv.toDataURL(/png/.test(file.type) && max <= 400 ? "image/png" : "image/jpeg", .86));
      }; im.onerror = () => done(r.result); im.src = r.result; }; r.readAsDataURL(file);
    } else {
      if (file.size > 15e6) toast("ไฟล์ใหญ่ " + (file.size / 1e6).toFixed(0) + "MB — แนะนำอัปไฟล์ขึ้น GitHub แล้วใส่เป็นชื่อไฟล์/ลิงก์แทน");
      const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(file);
    }
  });
}

/* ---------- ปัดขึ้นจากขอบล่างเพื่อออกจากแอป (แบบ iPhone) ---------- */
let gestMoved = false;
function homeTap() {
  if (document.querySelector(".callv")) return;
  if (!unlocked) return toPass();
  if (current || document.querySelector(".story,.viewer,.sheet")) goHome();
}
function goHome(targets) {
  targets = targets || [current && $("#v-" + current), ...document.querySelectorAll(".story,.viewer,.sheet")].filter(Boolean);
  const home = $("#home");
  targets.forEach(t => { t.style.transition = "transform .34s cubic-bezier(.3,.7,.2,1), opacity .3s, border-radius .3s"; t.style.transform = "translateY(-12%) scale(.28)"; t.style.opacity = "0"; t.style.borderRadius = "48px"; t.style.overflow = "hidden"; });
  home.style.transition = "transform .34s cubic-bezier(.3,.7,.2,1)"; home.style.transform = "";
  setTimeout(() => {
    targets.forEach(t => t.style.transition = "none");
    document.querySelectorAll(".story,.viewer,.sheet").forEach(x => x.remove()); stopStory(); closeApps();
    requestAnimationFrame(() => targets.forEach(t => ["transition", "transform", "opacity", "borderRadius", "overflow"].forEach(k => t.style[k] = "")));
    home.style.transition = "";
  }, 330);
}
function initHomeGesture() {
  const hb = $("#homebar"), home = $("#home"); let y0 = null, x0 = 0, t0 = 0, dy = 0, targets = [];
  hb.addEventListener("pointerdown", e => {
    if (document.querySelector(".callv")) return;
    y0 = e.clientY; x0 = e.clientX; t0 = performance.now(); dy = 0; gestMoved = false; hb.classList.add("drag");
    try { hb.setPointerCapture(e.pointerId); } catch (x) {}
    targets = unlocked ? [current && $("#v-" + current), ...document.querySelectorAll(".story,.viewer,.sheet")].filter(Boolean) : [];
    targets.forEach(t => { t.style.transition = "none"; t.style.overflow = "hidden"; });
    if (targets.length) { home.style.transition = "none"; home.style.transform = "scale(.92)"; }
  });
  hb.addEventListener("pointermove", e => {
    if (y0 === null) return;
    dy = Math.min(0, e.clientY - y0); const dx = e.clientX - x0; if (Math.abs(dy) > 6 || Math.abs(dx) > 6) gestMoved = true;
    if (!targets.length) return;
    const pr = Math.min(1, -dy / 320), k = 1 - pr * .45;
    targets.forEach(t => { t.style.transform = `translate(${dx * .35}px,${dy * .6}px) scale(${k})`; t.style.borderRadius = Math.min(50, -dy / 2.5) + "px"; });
    home.style.transform = "scale(" + (.92 + .08 * pr) + ")";
  });
  const up = () => {
    if (y0 === null) return; hb.classList.remove("drag");
    const v = -dy / Math.max(1, performance.now() - t0); y0 = null;
    if (!gestMoved) { targets.forEach(t => ["transition", "transform", "borderRadius", "overflow"].forEach(k => t.style[k] = "")); home.style.transform = ""; home.style.transition = ""; return homeTap(); }
    if (!unlocked) { if (dy < -30) toPass(); return; }
    if (!targets.length) return;
    if (-dy > 90 || v > .5) return goHome(targets);
    targets.forEach(t => { t.style.transition = "transform .3s cubic-bezier(.3,.7,.2,1), border-radius .3s"; t.style.transform = ""; t.style.borderRadius = ""; });
    home.style.transition = "transform .3s"; home.style.transform = "scale(.92)";
    setTimeout(() => { targets.forEach(t => ["transition", "overflow"].forEach(k => t.style[k] = "")); home.style.transform = ""; home.style.transition = ""; }, 320);
  };
  hb.addEventListener("pointerup", up); hb.addEventListener("pointercancel", up);
}

/* สร้างไฟล์เว็บทั้งไฟล์จากข้อมูลปัจจุบัน */
function buildHTML() {
  const doc = new DOMParser().parseFromString(PRISTINE, "text/html"), cfg = clone(C); cfg._v = Date.now();
  const css = doc.getElementById("css").textContent, phoneHTML = doc.getElementById("phone").outerHTML, code = doc.getElementById("main").textContent;
  const cfgTxt = "\n/* ข้อมูลทั้งหมดของมือถือ — แก้ผ่านแอปการตั้งค่าในเว็บได้เลย */\nlet C = " + JSON.stringify(cfg, null, 1).replace(/</g, "\\u003c") + ";\n";
  const title = String(C.phone.name || "Phone").replace(/[<&]/g, "");
  const html = '<!DOCTYPE html>\n<html lang="th">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">\n<meta name="theme-color" content="#000000">\n<title>' + title + '</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Grand+Hotel&display=swap" rel="stylesheet">\n<style id="css">' + css + '</style>\n</head>\n<body>\n' + phoneHTML + '\n<script id="cfg">' + cfgTxt + '</' + 'script>\n<script id="main">' + code + '</' + 'script>\n</body>\n</html>\n';
  return {html, v: cfg._v};
}
function markSaved(v) { C._v = v; dbSet(DBK, {base: C._v, cfg: C}).catch(() => {}); }
async function exportHTML() {
  const {html, v} = buildHTML(), blob = new Blob([html], {type: "text/html"});
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({filename: "index.html", data: blob}); markSaved(v); toast("บันทึกไฟล์ index.html แล้ว"); }
    catch (e) { if (e && e.code === "declined") toast("ยกเลิกการดาวน์โหลด"); else { toast("ดาวน์โหลดไม่ได้ ใช้ปุ่ม “คัดลอกโค้ดเว็บ” แทน"); } }
    return;
  }
  const a = el("a"); a.href = URL.createObjectURL(blob); a.download = "index.html"; document.body.appendChild(a); a.click(); a.remove();
  markSaved(v);
  const mb = blob.size / 1e6; toast("ถ้าไม่มีไฟล์ดาวน์โหลด ให้ใช้ปุ่ม “คัดลอกโค้ดเว็บ” แทน (" + mb.toFixed(1) + " MB)");
}
function copyHTML() {
  const {html, v} = buildHTML(), mb = html.length / 1e6;
  const fallback = () => sheet(sc => {
    const pf = el("div", "pf"), ta = el("textarea", "inp"); ta.value = html; ta.readOnly = true; ta.style.cssText = "height:180px;font-size:11px;font-family:monospace";
    pf.append(el("h3", null, "คัดลอกโค้ดทั้งหมดในกล่องนี้"), el("p", null, "แตะในกล่อง › เลือกทั้งหมด › คัดลอก"), ta); sc.appendChild(pf); setTimeout(() => { ta.focus(); ta.select(); }, 60);
  });
  try {
    navigator.clipboard.writeText(html).then(() => { markSaved(v); toast("คัดลอกโค้ดแล้ว (" + mb.toFixed(1) + " MB) ไปวางใน GitHub ได้เลย"); }, () => { markSaved(v); fallback(); });
  } catch (e) { markSaved(v); fallback(); }
}
